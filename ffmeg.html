<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Générateur de commande FFmpeg</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; max-width: 700px; margin: 40px auto; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #3b82f6; }
    label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9em; color: #aaa; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; }
    .row { display: flex; gap: 15px; }
    .row > div { flex: 1; }
    .output-box { margin-top: 25px; background: #000; padding: 15px; border-radius: 6px; position: relative; border: 1px solid #333; }
    code { font-family: monospace; color: #10b981; word-break: break-all; white-space: pre-wrap; font-size: 0.95em; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 20px; margin-top: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ Générateur FFmpeg pour dossier</h2>

  <label for="os">Système d'exploitation / Terminal :</label>
  <select id="os" onchange="generate()">
    <option value="cmd">Windows - Invite de commande (CMD)</option>
    <option value="ps">Windows - PowerShell</option>
    <option value="bash">Mac / Linux - Terminal (Bash/Zsh)</option>
  </select>

  <label for="path">Chemin du dossier :</label>
  <input type="text" id="path" value="C:\Users\user\Desktop\youtube" oninput="generate()">

  <div class="row">
    <div>
      <label for="codec">Codec vidéo :</label>
      <select id="codec" onchange="generate()">
        <option value="libx264">H.264 (Universel)</option>
        <option value="libx265">H.265 / HEVC (Ultra léger)</option>
      </select>
    </div>
    <div>
      <label for="crf">Qualité / Compression (CRF) :</label>
      <select id="crf" onchange="generate()">
        <option value="23">23 - Haute qualité (Fichier moyen)</option>
        <option value="28" selected>28 - Équilibré (Recommandé)</option>
        <option value="32">32 - Forte compression (Très léger)</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label for="preset">Vitesse d'encodage :</label>
      <select id="preset" onchange="generate()">
        <option value="ultrafast">Ultra rapide (Moins optimisé)</option>
        <option value="fast">Rapide</option>
        <option value="slow" selected>Lent (Meilleure compression)</option>
      </select>
    </div>
    <div>
      <label for="audio">Audio :</label>
      <select id="audio" onchange="generate()">
        <option value="-acodec copy">Conserver l'audio d'origine</option>
        <option value="-c:a aac -b:a 128k">Compresser en AAC 128k</option>
      </select>
    </div>
  </div>

  <div class="output-box">
    <code id="result">...</code>
    <button onclick="copyCommand()">Copier la commande</button>
  </div>
</div>

<script>
function generate() {
  const os = document.getElementById('os').value;
  let path = document.getElementById('path').value.trim();
  const codec = document.getElementById('codec').value;
  const crf = document.getElementById('crf').value;
  const preset = document.getElementById('preset').value;
  const audio = document.getElementById('audio').value;

  let cmd = "";

  if (os === "cmd") {
    // Escape backslashes for path if needed
    cmd = `cd /d "${path}" && for %i in (*.mp4 *.mov *.mkv) do ffmpeg -i "%i" -vcodec ${codec} -crf ${crf} -preset ${preset} ${audio} "compressed_%i"`;
  } else if (os === "ps") {
    cmd = `Set-Location "${path}"; Get-ChildItem *.mp4,*.mov,*.mkv | ForEach-Object { ffmpeg -i $_.FullName -vcodec ${codec} -crf ${crf} -preset ${preset} ${audio} "compressed_$($_.Name)" }`;
  } else if (os === "bash") {
    cmd = `cd "${path}" && for file in *.{mp4,mov,mkv}; do [ -f "$file" ] && ffmpeg -i "$file" -vcodec ${codec} -crf ${crf} -preset ${preset} ${audio} "compressed_$file"; done`;
  }

  document.getElementById('result').textContent = cmd;
}

function copyCommand() {
  const text = document.getElementById('result').textContent;
  navigator.clipboard.writeText(text);
  alert("Commande copiée dans le presse-papier !");
}

generate();
</script>

</body>
</html>
